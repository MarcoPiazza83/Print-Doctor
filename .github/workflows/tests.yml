name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The plugin compiles
        run: python -m py_compile print_doctor.py

      - name: Safety tests
        run: python -m unittest discover tests

      - name: Embedded skills match skills/*.md
        run: |
          python incorpora_skill.py
          git diff --exit-code -- print_doctor.py
